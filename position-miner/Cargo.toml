[package]
name = "position-miner"
version = "0.1.0"
edition = "2021"
description = "Mines balanced-but-decisive endgame positions out of lichess database dumps."
license = "MIT"

[[bin]]
name = "arcpos"
path = "src/main.rs"

[dependencies]
shakmaty = "0.27"
# Streaming PGN parser from the same author as shakmaty.
pgn-reader = "0.26"
zstd = "0.13"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
